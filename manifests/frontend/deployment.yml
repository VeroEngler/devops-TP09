apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-portfolio
  labels:
    app: frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: devops-tp06-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
